name: ART VPN — End-to-end verified build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-vpn-repair-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ART project and overlays
        uses: actions/checkout@v4
        with:
          path: art

      - name: Set up Go 1.25.5 for patched sing-box core
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache: false

      - name: Set up Java 17 for gomobile
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.0.13004108

      - name: Install Android 17 preview SDK 37.1
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --list --channel=3 > "$RUNNER_TEMP/sdk-preview-packages.txt"
          echo "Available Android 37 preview packages:"
          grep -E 'platforms;android-37(\.0)?([[:space:]]|$)|build-tools;37\.' "$RUNNER_TEMP/sdk-preview-packages.txt" || true

          PLATFORM_PACKAGE="$(awk -F'|' '/^[[:space:]]*platforms;android-37(\.0)?([[:space:]]|$)/ {gsub(/[[:space:]]/, "", $1); print $1; exit}' "$RUNNER_TEMP/sdk-preview-packages.txt")"
          BUILD_TOOLS_PACKAGE="$(awk -F'|' '/^[[:space:]]*build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' "$RUNNER_TEMP/sdk-preview-packages.txt" | sort -V | tail -n 1)"

          test -n "$PLATFORM_PACKAGE" || { echo "Android API 37 preview package not found in Canary channel" >&2; exit 1; }
          test -n "$BUILD_TOOLS_PACKAGE" || { echo "Android Build Tools 37 preview package not found in Canary channel" >&2; exit 1; }

          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses
          test -d "$ANDROID_HOME/platforms/${PLATFORM_PACKAGE#platforms;}"
          echo "Installed $PLATFORM_PACKAGE and $BUILD_TOOLS_PACKAGE"

      - name: Build patched sing-box Android engine
        shell: bash
        run: bash art/scripts/build-libbox-art.sh "$GITHUB_WORKSPACE/upstream"

      - name: Build Linux sing-box probe binary
        working-directory: art/.sing-box-v1.14.4
        run: go build -tags with_utls -trimpath -o "$RUNNER_TEMP/sing-box-probe" ./cmd/sing-box

      - name: Verify VLESS/TLS/Reality and real HTTPS before APK build
        run: python3 art/scripts/probe-vless.py "$RUNNER_TEMP/sing-box-probe"

      - name: Set up Java 21 for Android app
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      # Cache the explicitly created ART debug key so future APK builds retain the same signer.
      - name: Restore ART signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artvpn-official-debug-keystore-v1

      - name: Create stable ART debug signing key if absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -noprompt -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Build the official Android client with ART overlay
        run: bash art/scripts/build-official-art.sh "$GITHUB_WORKSPACE/upstream"

      - name: Enable KVM access for the Android emulator
        id: kvm
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM is available; emulator will use hardware acceleration"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "KVM is unavailable; emulator will use the explicit TCG fallback"
          fi

      - name: Verify Android VPNService, TUN routing and HTTPS on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          # Used only when KVM is unavailable; does not disable hardware acceleration.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          # Android Test Device is optimized for automated UI/service tests and has no heavy Pixel Launcher.
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disable-linux-hw-accel: ${{ steps.kvm.outputs.available != 'true' }}
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim
          script: python3 art/scripts/test-android-vpn.py art/dist/ART-VPN-universal.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ART-VPN-arm64
          path: art/dist/ART-VPN-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish ART VPN release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.4-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ART VPN 1.0.4 — build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: art/dist/ART-VPN-arm64.apk
          fail_on_unmatched_files: true
