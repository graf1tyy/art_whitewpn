name: Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Keep the Gradle debug signing certificate stable between builds so
      # users can install new prereleases as normal app updates.
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artvpn-debug-keystore-v1
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk ART-VPN-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ART-VPN-arm64
          path: ART-VPN-arm64.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v0.4.2-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ART VPN 0.4.2 — build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ART-VPN-arm64.apk
          fail_on_unmatched_files: true
