name: ART VPN — Official sing-box base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-vpn-official-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ART project and overlays
        uses: actions/checkout@v4
        with:
          path: art

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK tools and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.0.13004108

      - name: Install Android 17 preview SDK 37.1
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --list --channel=3 > "$RUNNER_TEMP/sdk-preview-packages.txt"
          echo "Available Android 37 preview packages:"
          grep -E 'platforms;android-37([[:space:]]|$)|build-tools;37\.' "$RUNNER_TEMP/sdk-preview-packages.txt" || true

          PLATFORM_PACKAGE="$(awk -F'|' '/^[[:space:]]*platforms;android-37([[:space:]]|$)/ {gsub(/[[:space:]]/, "", $1); print $1; exit}' "$RUNNER_TEMP/sdk-preview-packages.txt")"
          BUILD_TOOLS_PACKAGE="$(awk -F'|' '/^[[:space:]]*build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' "$RUNNER_TEMP/sdk-preview-packages.txt" | sort -V | tail -n 1)"

          test -n "$PLATFORM_PACKAGE" || { echo "Android API 37 preview package not found in Canary channel" >&2; exit 1; }
          test -n "$BUILD_TOOLS_PACKAGE" || { echo "Android Build Tools 37 preview package not found in Canary channel" >&2; exit 1; }

          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --channel=3 "$PLATFORM_PACKAGE" "$BUILD_TOOLS_PACKAGE"
          printf 'y\n%.0s' {1..100} | "$SDKMANAGER" --licenses
          test -d "$ANDROID_HOME/platforms/android-37"
          echo "Installed $PLATFORM_PACKAGE and $BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle 9.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      # Reuse the exact debug certificate used by earlier ART VPN builds so
      # this official-engine build can be installed as an update of com.artvpn.app.
      - name: Restore ART signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artvpn-debug-keystore-v1

      - name: Build the official Android client with ART overlay
        run: bash art/scripts/build-official-art.sh "$GITHUB_WORKSPACE/upstream"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ART-VPN-arm64
          path: art/dist/ART-VPN-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish ART VPN release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ART VPN 1.0.0 — build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: art/dist/ART-VPN-arm64.apk
          fail_on_unmatched_files: true
